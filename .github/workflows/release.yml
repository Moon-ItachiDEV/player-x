# Prépare une version de Player X : installeur NSIS + latest.yml + .blockmap dans une release en BROUILLON sur GitHub.
# Déclenché par un tag vX.Y.Z (git tag v0.4.1 && git push --tags) ou à la main depuis l'onglet Actions (le tag v<version> est alors créé).
# Notes de version : docs/release-notes/<version>.md si le fichier existe, sinon générées par GitHub.
# Version de test (« 0.8.1-beta.1 », avec un tiret) : la release est marquée préversion. Seul le canal Bêta de Player X
# (Paramètres › À propos) la voit ; le canal Stable lit /releases/latest, qui ne renvoie jamais une préversion.
# La release reste en brouillon : elle est publiée par le workflow « Publish » avec la signature de l'installeur,
# faite hors de GitHub avec la clé privée (node scripts/update-signature.mjs sign …). Player X refuse les mises à jour non signées.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # Actions épinglées sur un commit (v5.1.0 et v5.0.0), sans jeton git laissé sur le disque pour les scripts npm.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm

      # Le tag doit correspondre à "version" dans package.json : electron-builder publie sous v<version>.
      - name: Vérifier le tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Le tag ${GITHUB_REF_NAME} ne correspond pas à la version de package.json (${version}). Mets à jour \"version\" puis recrée le tag."
            exit 1
          fi

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npx tsc --noEmit -p tsconfig.json

      - name: Compiler
        run: npx electron-vite build

      # La release est préparée en brouillon AVANT electron-builder : il envoie l'exe et le blockmap en parallèle,
      # et s'il doit créer la release lui-même, les deux envois la créent en même temps et l'un échoue (422).
      # Le brouillon reste invisible pour les mises à jour tant que tous les fichiers ne sont pas envoyés.
      # Lancement manuel : le tag v<version> est créé sur ce commit (un tag poussé avec GITHUB_TOKEN ne relance pas ce workflow).
      - name: Préparer la release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          pre=""
          case "${version}" in *-*) pre="--prerelease" ;; esac
          if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${tag}" -f sha="${GITHUB_SHA}" > /dev/null
          fi
          if gh release view "${tag}" > /dev/null 2>&1; then
            echo "La release ${tag} existe déjà : electron-builder y ajoute les fichiers."
          else
            notes="docs/release-notes/${version}.md"
            if [ -f "${notes}" ]; then
              gh release create "${tag}" --draft ${pre} --verify-tag --title "Player X ${version}" --notes-file "${notes}"
            else
              gh release create "${tag}" --draft ${pre} --verify-tag --title "Player X ${version}" --generate-notes
            fi
          fi

      # Fenêtre « Mise à jour de Player X » (installer/cmd/update, Go + WebView2), rangée dans l'appli (extraResources).
      # Essayée ici sur Windows (mise à jour simulée de bout en bout) : si elle ne se construit pas ou si l'essai échoue,
      # elle n'est pas livrée et les mises à jour de cette version s'installent comme avant, sans fenêtre.
      - uses: actions/setup-go@v5
        continue-on-error: true
        timeout-minutes: 5
        with:
          go-version-file: installer/go.mod
          cache: false

      - name: Construire et essayer la fenêtre de mise à jour
        id: update_window
        continue-on-error: true
        timeout-minutes: 6
        shell: bash
        run: |
          mkdir -p build/update-window
          node scripts/build-update-window.mjs --ci "${RUNNER_TEMP}/update-window"

      - name: Retirer la fenêtre de mise à jour non essayée
        if: steps.update_window.outcome != 'success'
        shell: bash
        run: rm -f build/update-window/player-x-update.exe

      - name: Construire et envoyer l'installeur
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Les trois fichiers attendus par electron-updater doivent être là. La release reste en brouillon :
      # le workflow « Publish » la publie une fois l'installeur signé (empreinte affichée ci-dessous).
      - name: Vérifier la release et afficher l'empreinte à signer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          assets="$(gh release view "${tag}" --json assets --jq '.assets[].name')"
          for f in latest.yml "Player-X-Setup-${version}.exe" "Player-X-Setup-${version}.exe.blockmap"; do
            if ! grep -qxF "${f}" <<< "${assets}"; then
              echo "::error::Fichier manquant dans la release ${tag} : ${f}"
              exit 1
            fi
          done
          sha="$(node scripts/update-signature.mjs hash "dist/Player-X-Setup-${version}.exe")"
          echo "UPDATE_TO_SIGN version=${version} sha512=${sha}"
          {
            case "${version}" in *-*) echo "### Version de test ${tag} prête en brouillon (préversion : canal Bêta seulement)" ;; *) echo "### Release ${tag} prête en brouillon" ;; esac
            echo ""
            echo "Signer (hors de GitHub) : \`node scripts/update-signature.mjs sign ${version} ${sha} <clé-privée.pem>\`"
            echo ""
            echo "Puis lancer le workflow **Publish** avec la signature obtenue."
          } >> "${GITHUB_STEP_SUMMARY}"

      # Installeur sur mesure (installer/, Go + WebView2) : pour une première installation. Il contient l'installeur ci-dessus,
      # lancé en silencieux ; les fichiers des mises à jour (latest.yml, .blockmap, .sig) n'en dépendent pas.
      # Après la vérification : un échec ici ne cache ni l'empreinte à signer ni les fichiers des mises à jour.
      # Go est déjà installé (fenêtre de mise à jour, plus haut).
      - name: Construire, essayer et envoyer l'installeur sur mesure
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          out="dist/Player-X-Installer-${version}.exe"
          node scripts/build-installer.mjs "dist/Player-X-Setup-${version}.exe" dist/win-unpacked "${version}" "${out}"
          dir="$(cygpath -w "${RUNNER_TEMP}")\\pxtest\\Player X"
          "${out}" --selftest-install "${dir}" > "${RUNNER_TEMP}/selftest.log" 2>&1 || { cat "${RUNNER_TEMP}/selftest.log"; echo "::error::L'installeur sur mesure a échoué"; exit 1; }
          cat "${RUNNER_TEMP}/selftest.log"
          gh release upload "v${version}" "${out}" --clobber
