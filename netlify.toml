# Landing Player X : site statique dans site/, sans dépendance. Ce fichier est à la racine du dépôt pour que Netlify
# trouve le site sans réglage : il ne construit jamais l'appli Electron (pas de npm install, pas de npm run build).
# base = site : Netlify se place dans site/ ; publish et command sont relatifs à ce dossier (publié : site/public).
# Les réglages de l'interface Netlify (Build command, Publish directory) sont remplacés par ceux-ci.
# La commande de build écrit seulement la version de la dernière release GitHub dans index.html
# (si GitHub ne répond pas, la version déjà écrite est gardée).
[build]
  base = "site"
  publish = "public"
  command = "node version.mjs"

[build.environment]
  NODE_VERSION = "22"

# Lien de téléchargement stable, sans JS
[[redirects]]
  from = "/telecharger"
  to = "https://github.com/Moon-ItachiDEV/player-x/releases/latest"
  status = 302
  force = true

# Fichiers versionnés (dossier /assets/v1/) : cache d'un an. Changer de dossier (v2) à chaque modification.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sécurité ; le HTML garde le cache Netlify par défaut (max-age=0, must-revalidate)
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
